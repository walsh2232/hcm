name: Oracle HCM documentation freshness

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
  push:
    paths:
      - ".project/docs/oracle/**/source-manifest.json"
      - "scripts/oracle_hcm_knowledge.py"
      - ".github/workflows/oracle-docs-freshness.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: oracle-docs-freshness
  cancel-in-progress: false

jobs:
  check-sources:
    name: Check official Oracle Recruiting sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate manifest, syntax, and local tests
        run: |
          python -m py_compile scripts/oracle_hcm_knowledge.py
          python -c "from pathlib import Path; import json; ps=list(Path('.project/docs/oracle').glob('*/source-manifest.json')); assert ps; [(lambda p,d: print(p, d['module_code'], len(d['sources']), 'sources'))(p,json.loads(p.read_text(encoding='utf-8'))) for p in ps]"
          python -m unittest discover -s tests -p 'test_oracle_hcm_knowledge.py'

      - name: Refresh source fingerprints and discover each module's latest readiness release
        continue-on-error: true
        shell: bash
        run: |
          failed=0
          for manifest in .project/docs/oracle/*/source-manifest.json; do
            echo "Refreshing $manifest"
            python scripts/oracle_hcm_knowledge.py refresh --manifest "$manifest" --timeout 45 || failed=1
          done
          exit "$failed"

      - name: Report source status
        if: always()
        run: python scripts/oracle_hcm_knowledge.py status

      - name: Open a review PR if source fingerprints or release changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(orc): refresh Oracle source fingerprints"
          title: "Automated Oracle Recruiting documentation refresh"
          body: |
            Automated weekly check of official Oracle Recruiting documentation.

            Review the generated source-status snapshot for URL failures, changed source fingerprints, and the latest release-readiness page discovered by its title/content. This PR contains metadata only; it does not include Oracle manuals or extracted guide text.
          branch: automation/oracle-docs-freshness
          delete-branch: true
          add-paths: |
            .project/docs/oracle/**/source-status.json
